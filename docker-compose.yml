services:
  app:
    build: .
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - uploads:/app/uploads
    environment:
      - FLASK_DEBUG=0

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  uploads:
