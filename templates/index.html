<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate Generator</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>Certificate Generator</h1>

        <!-- Step 1: Upload -->
        <section class="card" id="upload-section">
            <h2>1. Upload Files</h2>
            <div class="upload-row">
                <div class="dropzone" id="template-dropzone">
                    <input type="file" id="template-input" accept=".png,.jpg,.jpeg,.webp" hidden>
                    <div class="dropzone-icon" id="template-icon">
                        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                            <circle cx="8.5" cy="8.5" r="1.5"/>
                            <polyline points="21 15 16 10 5 21"/>
                        </svg>
                    </div>
                    <p class="dropzone-label">Drop certificate template here<br><small>PNG, JPG, WEBP</small></p>
                    <p class="dropzone-status" id="template-status"></p>
                </div>
                <div class="dropzone" id="data-dropzone">
                    <input type="file" id="data-input" accept=".csv,.xlsx,.xls" hidden>
                    <div class="dropzone-icon" id="data-icon">
                        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                            <line x1="16" y1="13" x2="8" y2="13"/>
                            <line x1="16" y1="17" x2="8" y2="17"/>
                            <polyline points="10 9 9 9 8 9"/>
                        </svg>
                    </div>
                    <p class="dropzone-label">Drop data file here<br><small>CSV, XLSX</small></p>
                    <p class="dropzone-status" id="data-status"></p>
                </div>
            </div>
        </section>

        <!-- Data Preview (collapsible) -->
        <section class="card section-reveal" id="preview-section">
            <h2 class="collapsible-header" id="preview-toggle">Data Preview <span class="collapse-arrow">&#9662;</span></h2>
            <div class="collapsible-body" id="preview-body">
                <div class="table-wrapper">
                    <table id="data-preview-table"></table>
                </div>
            </div>
        </section>

        <!-- Step 2: Map Fields (two-column layout) -->
        <section class="card section-reveal" id="mapping-section">
            <h2>2. Place Fields on Template</h2>

            <div class="mapping-layout">
                <!-- Left: Template preview -->
                <div class="mapping-left">
                    <div class="hint-banner section-reveal" id="hint-banner">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>
                        </svg>
                        <span id="hint-text">Select a column, then click on the template to place it.</span>
                    </div>
                    <div class="template-preview-wrapper" id="preview-wrapper">
                        <img id="template-preview" src="" alt="Template Preview">
                        <div id="markers-layer"></div>
                    </div>
                </div>

                <!-- Right: Controls panel -->
                <div class="mapping-right">
                    <div class="controls-group">
                        <h3>Columns</h3>
                        <div class="columns-bar" id="columns-bar"></div>
                    </div>

                    <div class="controls-group">
                        <h3>Default Settings</h3>
                        <div class="settings-row">
                            <label>Font Size: <input type="number" id="font-size" value="30" min="8" max="200"></label>
                            <label>Color: <input type="color" id="text-color" value="#684631"></label>
                        </div>
                        <div class="settings-row">
                            <label>Font:
                                <select id="font-select">
                                    <option value="">Default</option>
                                </select>
                            </label>
                            <button class="btn-upload-font" id="upload-font-btn">+ Upload Font</button>
                            <input type="file" id="font-upload-input" accept=".ttf,.otf" hidden>
                        </div>
                    </div>

                    <div class="controls-group">
                        <h3>Placed Fields</h3>
                        <div id="fields-list"></div>
                        <p class="empty-fields-msg" id="empty-fields-msg">No fields placed yet.</p>
                    </div>

                    <div class="controls-group generate-group">
                        <button id="generate-btn" class="btn-primary btn-generate">
                            <span class="btn-label">Generate &amp; Download ZIP</span>
                        </button>
                        <div id="generate-status" class="status-msg"></div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
